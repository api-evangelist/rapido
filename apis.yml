name: Rapido
description: 'Rapido is an Indian on-demand urban mobility platform that connects riders
  with independent driver-partners (called "Captains") for bike taxis, auto rickshaws,
  and cabs through its consumer and Captain mobile apps. Founded in Bengaluru and backed
  by Accel, Rapido operates across hundreds of Indian cities and has expanded into parcel
  delivery and corporate mobility. As of this enrichment pass Rapido exposes only a
  consumer-facing web and app surface — no public developer API, developer portal, SDK,
  or machine-readable specification was found. This profile captures the company identity,
  its published policy and content pages, and a domain-security probe.'
